codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # PATCH COVERAGE GATE - SINGLE PLACE TO RATCHET.
        # New/modified lines must be covered at least at `target`.
        # Planned ratchet: 80% -> 95% -> 100%. Change ONLY this value
        # (and the matching mention in CONTRIBUTING.md) when raising the bar.
        # Do not add `ignore` entries to make the number pass.
        # threshold 0%: the bar IS the target — 95% must mean 95%, not 90%
        # (a 5% threshold under a 95% target would gate at 90%).
        target: 95%
        threshold: 0%

ignore:
  # Desktop Tauri app — separate crate, not compiled by cargo llvm-cov
  - "desktop/**"
  # Chat (src/chat/**, src/api/chat_handlers.rs, src/api/ws_chat_handler.rs,
  # src/neo4j/chat.rs) — NOT excluded since B19: the "needs a live CLI" motive
  # is gone, the tests run on the nexus fakes (fake_claude, the scripted
  # provider) and on the CI's Neo4j. See docs/COVERAGE_EXCLUSIONS.md.
  # Neo4j layer — NOT excluded because it needs a live Neo4j: the CI provisions
  # one (integration-tests, api-tests, coverage jobs), so these files are
  # measurable. What is left below is untested code with an owner, tracked one
  # by one in docs/COVERAGE_EXCLUSIONS.md. The count may only go down.
  #
  # Removed 2026-10-01 together with the tests that cover them
  # (tests/neo4j_store_tests.rs + tests/workspace_tests.rs, now part of the
  # coverage job's merged lcov): client, traits, workspace, milestone,
  # constraint, release, commit, decision, user.
  - "src/neo4j/analytics.rs"       # needs the GDS plugin, absent from CI (APOC only)
  - "src/neo4j/code.rs"            # code-intelligence suite, task 2.B
  - "src/neo4j/event_trigger.rs"   # task 2.C
  - "src/neo4j/feature_graph.rs"   # task 2.B
  - "src/neo4j/impl_graph_store.rs" # rises as the per-domain suites land
  - "src/neo4j/note.rs"            # task 2.D
  - "src/neo4j/persona.rs"         # task 2.D
  - "src/neo4j/plan.rs"            # task 2.C
  - "src/neo4j/plan_run.rs"        # task 2.C
  - "src/neo4j/project.rs"         # task 2.B
  - "src/neo4j/step.rs"            # task 2.C
  - "src/neo4j/task.rs"            # task 2.C
  # Route registration — pure infrastructure (just .route() wiring).
  # No business logic to unit-test; covered by integration/API tests.
  - "src/api/routes.rs"
  # Server bootstrap — start_server / start_setup_server bind Axum servers,
  # read env vars, and configure middleware. Pure infrastructure, not unit-testable.
  # Covered by integration/API tests (ci.yml jobs).
  - "src/lib.rs"
  # Main entry points
  - "src/main.rs"
  - "src/bin/**"
  # NATS pub/sub wrappers — publish_*/subscribe_* require a live NATS broker
  # (covered by integration tests). Subject-builder helpers are unit-tested
  # but only count for ~20% of the file's lines, dragging patch coverage
  # below the 80% gate on any PR that adds a new pub/sub method.
  - "src/events/nats.rs"
