# cargo-about configuration: the third-party notices shipped with every release
# (THIRD-PARTY-LICENSES.txt, generated by scripts/third-party-licenses.sh).
#
# `accepted` is the license allow-list of deny.toml ([licenses].allow), minus BUSL-1.1:
# BUSL-1.1 is only on our own crates, which are `publish = false` and skipped below
# (`private.ignore`), since our own license is shipped as LICENSE / LICENSE-MIT / LICENSE-EE.
# Keep the two lists in step: a license deny.toml accepts must be listed here, or the
# notices step of the release fails.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
    "NCSA",
]

# The release targets: a dependency used by none of them is not shipped.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Test-only code is never distributed. Build dependencies stay listed: proc-macros and
# build scripts generate code that ends up in the binaries.
ignore-dev-dependencies = true

# Our own crates (`publish = false`): not third-party.
private = { ignore = true }

# Known crates whose license metadata needs help (ring: MIT AND ISC AND OpenSSL, as
# clarified in deny.toml).
workarounds = ["ring"]
