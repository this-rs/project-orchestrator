name: Build the nexus fake servers
description: >
  Installs `fake_openai`, `fake_mcp` and `fake_claude` of the nexus repository at the revision
  Cargo.toml pins, and exports NEXUS_FAKES_DIR. src/chat/agent_e2e_tests.rs drives
  the agent engine against them and FAILS (naming this action) when they are missing.
runs:
  using: composite
  steps:
    - name: cargo install the fake servers
      shell: bash
      run: |
        REV=$(sed -n 's/^nexus-claude = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml | head -n1)
        test -n "$REV"
        cargo install --git https://github.com/this-rs/nexus.git --rev "$REV" \
          --features "provider-native testkit" --root "$RUNNER_TEMP/nexus-fakes" \
          --bin fake_openai --bin fake_mcp --bin fake_claude nexus-claude
        echo "NEXUS_FAKES_DIR=$RUNNER_TEMP/nexus-fakes/bin" >> "$GITHUB_ENV"
