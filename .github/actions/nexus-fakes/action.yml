name: Build the nexus fake servers
description: >
  Installs `fake_openai`, `fake_mcp`, `fake_claude` and `fake_acp` of the nexus repository, and
  the real `nexus-tools`, at the revision Cargo.toml pins, and exports NEXUS_FAKES_DIR.
  `nexus-tools` is built exactly as the release ships it (scripts/build-nexus-tools.sh:
  same pinned revision, `--features tls,obscura`, V8 checksum-verified), so this is also the
  CI check that the pin builds the shipped tools.
  src/chat/agent_e2e_tests.rs drives the agent engine against them;
  src/chat/engine_parity_tests.rs plays ONE scenario on the Claude Code engine
  (fake_claude) and on the native harness (fake_openai + fake_mcp + nexus-tools) and
  checks docs/parity/engines.md. Both FAIL when a binary is missing.
runs:
  using: composite
  steps:
    - name: Resolve the pinned nexus revision
      id: rev
      shell: bash
      run: |
        REV=$(sed -n 's/^nexus-claude = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml | head -n1)
        test -n "$REV"
        echo "rev=$REV" >> "$GITHUB_OUTPUT"
        echo "root=$RUNNER_TOOL_CACHE/nexus-fakes/$REV-tls-obscura-acp" >> "$GITHUB_OUTPUT"

    # A hosted runner starts with an empty tool cache, so the installs below used to run in
    # every job that needs the fakes: 3.5-4 min each in Unit Tests and Code Coverage (measured
    # 19/10/2026). The binaries depend only on the pin and the runner image, so they are cached
    # under that key. Like the cargo caches, only main writes it; PRs restore main's.
    - name: Restore the fake servers of this pin
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.rev.outputs.root }}
        key: nexus-fakes-${{ runner.os }}-${{ runner.arch }}-${{ steps.rev.outputs.rev }}-tls-obscura-acp-v1

    - name: cargo install the fake servers
      shell: bash
      run: |
        REV=${{ steps.rev.outputs.rev }}
        # One directory per pinned revision in the tool cache: a self-hosted runner keeps it and
        # skips the cargo installs until the pin moves (a new pin = a new directory, so the check
        # that the pin builds the shipped tools still runs once per pin); a hosted runner starts
        # empty and installs every time.
        ROOT="$RUNNER_TOOL_CACHE/nexus-fakes/$REV-tls-obscura-acp"
        if [ -x "$ROOT/bin/fake_openai" ] && [ -x "$ROOT/bin/fake_mcp" ] \
          && [ -x "$ROOT/bin/fake_claude" ] && [ -x "$ROOT/bin/fake_acp" ] && [ -x "$ROOT/bin/nexus-tools" ]; then
          echo "nexus fakes for $REV already installed in $ROOT"
        else
          cargo install --git https://github.com/this-rs/nexus.git --rev "$REV" \
            --features "provider-native testkit" --root "$ROOT" \
            --bin fake_openai --bin fake_mcp --bin fake_claude --bin fake_acp nexus-claude
          # The shipped nexus-tools (tls and obscura on), as release.yml builds it.
          scripts/build-nexus-tools.sh "$ROOT"
        fi
        echo "NEXUS_FAKES_DIR=$ROOT/bin" >> "$GITHUB_ENV"

    - name: Save the fake servers of this pin (main only)
      if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.rev.outputs.root }}
        key: ${{ steps.restore.outputs.cache-primary-key }}
