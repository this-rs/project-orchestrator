name: Build the nexus fake servers
description: >
  Installs `fake_openai`, `fake_mcp` and `fake_claude` of the nexus repository, and
  the real `nexus-tools`, at the revision Cargo.toml pins, and exports NEXUS_FAKES_DIR.
  src/chat/agent_e2e_tests.rs drives the agent engine against them;
  src/chat/engine_parity_tests.rs plays ONE scenario on the Claude Code engine
  (fake_claude) and on the native harness (fake_openai + fake_mcp + nexus-tools) and
  checks docs/parity/engines.md. Both FAIL when a binary is missing.
runs:
  using: composite
  steps:
    - name: cargo install the fake servers
      shell: bash
      run: |
        REV=$(sed -n 's/^nexus-claude = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml | head -n1)
        test -n "$REV"
        # One directory per pinned revision in the tool cache: a self-hosted runner keeps it and
        # skips the ~2.5 min of `cargo install` until the pin moves; a hosted runner starts empty
        # and installs as before.
        ROOT="$RUNNER_TOOL_CACHE/nexus-fakes/$REV"
        if [ -x "$ROOT/bin/fake_openai" ] && [ -x "$ROOT/bin/fake_mcp" ] \
          && [ -x "$ROOT/bin/fake_claude" ] && [ -x "$ROOT/bin/nexus-tools" ]; then
          echo "nexus fakes for $REV already installed in $ROOT"
        else
          cargo install --git https://github.com/this-rs/nexus.git --rev "$REV" \
            --features "provider-native testkit" --root "$ROOT" \
            --bin fake_openai --bin fake_mcp --bin fake_claude nexus-claude
          cargo install --git https://github.com/this-rs/nexus.git --rev "$REV" \
            --root "$ROOT" --bin nexus-tools nexus-tools
        fi
        echo "NEXUS_FAKES_DIR=$ROOT/bin" >> "$GITHUB_ENV"
