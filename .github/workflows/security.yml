# Supply chain security — runs cargo-deny + cargo-audit on every
# PR and on every push to main. Fails the build if a known advisory,
# yanked version, license violation, or untrusted source slips in.
#
# Plan e81fb4de — Dependabot security audit (T7).

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily at 06:30 UTC — catches advisories published between
    # PR runs.
    - cron: "30 6 * * *"

permissions:
  contents: read
  # Required by rustsec/audit-check@v2 to post audit results as a
  # check run on the PR.
  checks: write
  issues: write

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # EmbarkStudios/cargo-deny-action rebuilt a Docker image from
      # rust:1.85.0-alpine3.20 on every run, which hit Docker Hub's anonymous
      # rate limit. Same cargo-deny version as that action used (0.20.2), as a
      # prebuilt binary from GitHub releases.
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2

      # The action ran `rustup show` in the manifest directory first, so
      # cargo metadata uses the repo's rust-toolchain.toml.
      - name: Install the repository toolchain
        run: rustup show

      # Same arguments as the action had (log-level warn, --all-features,
      # manifest ./Cargo.toml); deny.toml is read from the repo root.
      - name: Run cargo-deny (advisories, bans, licenses, sources)
        run: >-
          cargo-deny --log-level warn --all-features
          --manifest-path ./Cargo.toml
          check advisories bans licenses sources

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustsec/audit-check builds cargo-audit WITHOUT --locked, under this
      # repo's rust-toolchain.toml (1.95). Its freshly resolved dependency tree
      # now needs rustc >= 1.96 (kstring 2.0.5), so the job died compiling the
      # tool and never audited anything. Install exactly like ci.yml's
      # security-audit job, which works; ignores come from .cargo/audit.toml.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit
