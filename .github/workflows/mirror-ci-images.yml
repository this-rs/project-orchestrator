# Mirror the third-party images used by CI to ghcr.io.
#
# Why: pulling neo4j / meilisearch from Docker Hub anonymously hits its rate
# limit ("toomanyrequests") and makes CI fail at random. ghcr.io packages in
# this repository are read with the workflow's own GITHUB_TOKEN, no secret.
#
# What: for each line of .github/ci-images.txt (`<source>@sha256:... <target>`)
# copy the multi-architecture index registry-to-registry (no layer is pulled
# to the runner) and verify the target has the SAME index digest.
#
# Runs only on manual dispatch and weekly (so the packages stay alive and a
# transient failure is retried); never on pull_request. See docs/ci-images.md.
#
# The packages are PRIVATE by default (Neo4j Community is GPL: do not publish
# it by accident). Making a package public is done in the package settings.

name: Mirror CI images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions: {}

concurrency:
  group: mirror-ci-images
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to ghcr.io
    if: github.repository == 'this-rs/project-orchestrator'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TARGET_PREFIX: ghcr.io/${{ github.repository_owner }}/ci-mirror/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy and verify each image
        shell: bash
        run: |
          set -euo pipefail

          retry() { # retry <command...>: up to 5 attempts, growing delay
            local n=1 delay=10
            until "$@"; do
              if [ "$n" -ge 5 ]; then return 1; fi
              echo "attempt $n failed, retrying in ${delay}s" >&2
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }

          # shellcheck disable=SC2329 # called through retry
          digest_of() { # digest_of <ref>: digest of the top-level manifest/index
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }

          fail=0
          while read -r source target extra; do
            case "$source" in ''|'#'*) continue ;; esac
            [ -z "${extra:-}" ] && [ -n "${target:-}" ] || { echo "::error::bad line: $source"; exit 1; }
            case "$source" in *@sha256:[0-9a-f]*) ;; *) echo "::error::source must be pinned by digest: $source"; exit 1 ;; esac
            case "$target" in "$TARGET_PREFIX"*) ;; *) echo "::error::target must start with $TARGET_PREFIX: $target"; exit 1 ;; esac
            expected="${source##*@}"

            echo "::group::$source -> $target"
            if retry docker buildx imagetools create --tag "$target" "$source"; then
              actual="$(retry digest_of "$target")" || actual=""
              if [ "$actual" = "$expected" ]; then
                echo "OK: $target has digest $actual"
              else
                echo "::error::digest mismatch for $target: expected $expected, got '$actual'"
                fail=1
              fi
            else
              echo "::error::could not copy $source"
              fail=1
            fi
            echo "::endgroup::"
          done < .github/ci-images.txt
          exit "$fail"
