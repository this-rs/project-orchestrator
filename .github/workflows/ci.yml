name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Build - Compile once, share artifacts and cache
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: Build release binaries
        run: cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/release/orchestrator
            target/release/orch
            target/release/mcp_server
          retention-days: 1

  # ==========================================================================
  # Security Audit - Detect known vulnerabilities and license issues
  # ==========================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Clean stale lockfile entries
        run: cargo generate-lockfile

      - name: Run cargo audit (fails on known vulnerabilities)
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104
        # Ignored advisories (transitive, no fix available):
        #   RUSTSEC-2023-0071: rsa — via jsonwebtoken 10.3.0 (upstream must bump)
        #   RUSTSEC-2026-0049: rustls-webpki 0.101.7 URI name constraints — via nexus-claude pinned reqwest 0.11
        #   RUSTSEC-2026-0098: rustls-webpki 0.101.7 wildcard name constraints — same transitive dep
        #   RUSTSEC-2026-0099: rustls-webpki 0.101.7 — same transitive dep
        #   RUSTSEC-2026-0104: rustls-webpki 0.101.7 reachable panic in CRL parsing — same transitive dep

      - name: Run cargo deny (license + advisory check)
        run: cargo deny check advisories licenses
        continue-on-error: true  # advisory until deny.toml is fully tuned

  # ==========================================================================
  # Lint & Format - Fast feedback on code quality
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        # --workspace so EVERY member crate is linted (neural-routing-*,
        # tree-sitter-*), not just the root package. Without it, member crates
        # only compile as path-dependencies and their own targets/tests are
        # never linted. project-orchestrator-desktop is excluded until its
        # bollard 0.21 migration lands (tracked) — it doesn't compile on main
        # and needs Tauri system deps + the frontend dist to build on CI.
        run: cargo clippy --workspace --exclude project-orchestrator-desktop --all-targets --all-features -- -D warnings

  # ==========================================================================
  # Unit Tests - Library and parser tests without external services
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Run unit tests (lib)
        # --workspace so member crates' unit tests actually run in CI (the
        # neural-routing-* crates carry their own #[cfg(test)] suites that the
        # root-only `cargo test --lib` never executed). Desktop excluded — see
        # the clippy step.
        run: cargo test --workspace --exclude project-orchestrator-desktop --lib

      - name: Run parser tests
        run: cargo test --test parser_tests

  # ==========================================================================
  # Integration Tests - Requires Neo4j and Meilisearch
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      meilisearch:
        image: getmeili/meilisearch:v1.34
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Neo4j..."
          timeout 60 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          echo "Waiting for Meilisearch..."
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "All services are ready!"

      - name: Run integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_KEY: test-master-key
        run: |
          cargo test --test integration_tests --test data_migrations \
            --test workspace_tests --test neo4j_store_tests

  # ==========================================================================
  # API Tests - Downloads pre-built binary, requires Neo4j and Meilisearch
  # ==========================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [build, lint, unit-tests]
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      meilisearch:
        image: getmeili/meilisearch:v1.34
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/orchestrator target/release/orch target/release/mcp_server

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Neo4j..."
          timeout 60 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          echo "Waiting for Meilisearch..."
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "All services are ready!"

      - name: Write CI config.yaml
        run: |
          printf '%s\n' \
            'setup_completed: true' \
            'server:' \
            '  port: 8080' \
            '  serve_frontend: false' \
            'neo4j:' \
            '  uri: "bolt://localhost:7687"' \
            '  user: "neo4j"' \
            '  password: "testpassword"' \
            'meilisearch:' \
            '  url: "http://localhost:7700"' \
            '  key: "test-master-key"' \
            > config.yaml

      - name: Start server in background
        env:
          RUST_LOG: info
        run: |
          ./target/release/orchestrator serve --port 8080 &
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health > /dev/null 2>&1; do sleep 1; done'
          echo "Server is ready!"

      - name: Run API tests
        run: cargo test --test api_tests

  # ==========================================================================
  # Code Coverage - Generate and upload coverage report
  # ==========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [build]
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      meilisearch:
        image: getmeili/meilisearch:v1.34
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Wait for services to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "Neo4j + Meilisearch ready"

      # Coverage is collected in SEVERAL runs whose profraw data is then MERGED
      # into a single lcov (`--no-report` accumulates, `llvm-cov report` merges).
      # One run cannot do it: the unit tests span the whole workspace while the
      # Neo4j/Meilisearch suites are per-test-target, and a single invocation
      # would hide one behind the other.
      #
      # `clean --workspace` first, so stale profraw from the cargo cache cannot
      # inflate the numbers.
      - name: Reset coverage profile data
        run: cargo llvm-cov clean --workspace

      # (1) Unit tests, whole workspace (member crates carry their own suites).
      # `test_large_index_performance` is a wall-clock assertion that does not
      # hold under llvm-cov instrumentation — skipped here, still run by the
      # Unit Tests job. See docs/COVERAGE.md.
      - name: Collect coverage — unit tests (workspace)
        run: |
          cargo llvm-cov --no-report --no-fail-fast \
            --workspace --exclude project-orchestrator-desktop --lib \
            -- --skip test_large_index_performance

      # (2) Parser tests — no service needed.
      - name: Collect coverage — parser tests
        run: cargo llvm-cov --no-report --no-fail-fast --test parser_tests

      # (3) The suites that talk to the REAL Neo4j provisioned above. This is
      # what makes src/neo4j/* measurable instead of excluded: every GraphStore
      # method here runs against Neo4j, so its lines count.
      - name: Collect coverage — Neo4j integration suites
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_KEY: test-master-key
        run: |
          cargo llvm-cov --no-report --no-fail-fast \
            --test integration_tests \
            --test data_migrations \
            --test workspace_tests \
            --test neo4j_store_tests

      # (4) Merge every run above into one lcov.
      - name: Merge coverage runs into a single lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info

      # Guard: the merged report must actually contain the Neo4j lines. Without
      # it, a silently skipped integration suite (backends_available() returning
      # false) would upload a report that looks fine while covering nothing.
      - name: Assert the merged lcov covers src/neo4j
        run: |
          python3 scripts/assert_lcov_covers.py lcov.info \
            src/neo4j/workspace.rs \
            src/neo4j/milestone.rs \
            src/neo4j/constraint.rs \
            src/neo4j/release.rs \
            src/neo4j/commit.rs \
            src/neo4j/decision.rs \
            src/neo4j/user.rs \
            src/neo4j/traits.rs \
            src/neo4j/client.rs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
