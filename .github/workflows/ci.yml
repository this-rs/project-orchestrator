name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Cold run: nothing restored from any cache (see "Cache policy" below).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Cold run: ignore every cache (what a fresh clone costs, and proof nothing depends on a stale one)"
        type: boolean
        default: false

# A new push to a PR cancels the run it supersedes: iterating on a branch must not
# queue 30 minutes of runners behind results nobody will read. `main` is never
# cancelled (each push to it must finish: it is what fills the caches).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Toolchain: every job pins dtolnay/rust-toolchain@1.95.0, the same version as
# rust-toolchain.toml (keep the two in sync when bumping). "@stable" was
# ambiguous: the action installs stable, then rustup's rust-toolchain.toml
# override silently wins for cargo, so the action input was dead. cargo-audit /
# cargo-deny are installed with --locked under 1.95 on purpose: an unlocked
# install resolves deps needing rustc >= 1.96 (kstring 2.0.5) and fails to build
# (see security.yml).
# Cache policy
# - One cache per PROFILE, because a profile's dependencies are not another's:
#   release (Build), clippy/check (Lint), dev test (Unit/Integration/API), and
#   instrumented (Coverage) each compile the same ~600 crates differently. They used
#   to share one key written by the release Build only, so every other job restored
#   artefacts it could not use and recompiled everything.
# - Written ONLY by pushes to main; PRs restore main's. A PR that saved its own would
#   evict main's entries (GitHub keeps 10 GB per repo, least recently used first).
# - Invalidated by itself when Cargo.lock or the compiler changes (rust-cache hashes
#   both). Bump CACHE_VERSION to drop every cache at once (suspected poisoning).
# - Cold run: nightly (schedule) and on demand (workflow_dispatch, fresh=true) use a
#   key nobody has, so they compile from scratch and save nothing. That is the
#   truth about a fresh clone, and the check that warm runs do not hide a problem.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CACHE_VERSION: v2
  CACHE_FRESH: ${{ (github.event_name == 'schedule' || inputs.fresh) && format('-fresh-{0}', github.run_id) || '' }}
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  # ==========================================================================
  # Build - Compile once, share artifacts and cache
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-release-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: ${{ env.CACHE_SAVE == 'true' && env.CACHE_FRESH == '' }}
          cache-workspace-crates: true

      - name: Build release binaries
        run: cargo build --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/release/orchestrator
            target/release/orch
            target/release/mcp_server
          retention-days: 1

  # ==========================================================================
  # Security Audit - Detect known vulnerabilities and license issues
  # ==========================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-build"
          save-if: false

      # Prebuilt binaries: `cargo install` compiled both tools from source on every run
      # (200-280 s). Being prebuilt also removes the rustc-version trap noted at the top of
      # this file (an unlocked install resolving a dependency that needs a newer rustc).
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Clean stale lockfile entries
        run: cargo generate-lockfile

      - name: Run cargo audit (fails on known vulnerabilities)
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104
        # Ignored advisories (transitive, no fix available):
        #   RUSTSEC-2023-0071: rsa — via jsonwebtoken 10.3.0 (upstream must bump)
        #   RUSTSEC-2026-0049: rustls-webpki 0.101.7 URI name constraints — via nexus-claude pinned reqwest 0.11
        #   RUSTSEC-2026-0098: rustls-webpki 0.101.7 wildcard name constraints — same transitive dep
        #   RUSTSEC-2026-0099: rustls-webpki 0.101.7 — same transitive dep
        #   RUSTSEC-2026-0104: rustls-webpki 0.101.7 reachable panic in CRL parsing — same transitive dep

      - name: Run cargo deny (license + advisory check)
        run: cargo deny check advisories licenses
        continue-on-error: true  # advisory until deny.toml is fully tuned

  # ==========================================================================
  # Lint & Format - Fast feedback on code quality
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Embedded frontend carries the frames the backend uses
        run: scripts/check-dist-contract.sh dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-clippy-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: ${{ env.CACHE_SAVE == 'true' && env.CACHE_FRESH == '' }}
          cache-workspace-crates: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        # --workspace so EVERY member crate is linted (neural-routing-*,
        # tree-sitter-*), not just the root package. Without it, member crates
        # only compile as path-dependencies and their own targets/tests are
        # never linted. project-orchestrator-desktop is excluded until its
        # bollard 0.21 migration lands (tracked) — it doesn't compile on main
        # and needs Tauri system deps + the frontend dist to build on CI.
        run: cargo clippy --workspace --exclude project-orchestrator-desktop --all-targets --all-features -- -D warnings

      # Index des diagrammes (docs/diagrams/INDEX.yml). Node est deja sur les
      # runners ubuntu-latest : pas de setup-node, pas de package.json, pas de
      # nouvelle chaine d'outils dans un depot Rust.
      #
      # CE QUI EST VERIFIE ICI, et c'est tout : la structure de l'index, les
      # globs `backend:` qui ne matchent plus rien, un fichier revendique par
      # deux diagrammes, une entree `verified` sans son `.mmd`, un en-tete
      # invalide.
      #
      # Et le CLIQUET D'ORPHELINS DU BACKEND : son plafond par depot
      # (<!-- orphan-ceiling-backend: N -->) porte sur le meme perimetre que ce
      # checkout, donc ajouter un fichier source que nul diagramme verifie ne
      # revendique fait echouer cette etape.
      #
      # CE QUI NE L'EST PAS : les depots voisins (frontend, nexus, website) ne
      # sont pas dans ce checkout, donc leurs globs ne sont pas resolus, leurs
      # plafonds ne sont pas appliques, et ni le plafond TOTAL ni la fraicheur
      # de ORPHANS.md ne sont verifies — le script le dit en avertissement
      # plutot que de passer vert en silence. Ce vert ne prouve donc PAS
      # l'absence de derive : c'est la tache 1.1 qui branchera le gate complet
      # (checkout multi-depots ou artefact publie). Ne pas le citer comme
      # preuve de non-derive.
      - name: Check diagram index (partial — see comment)
        run: node scripts/diagrams/check-index.mjs

      - name: Test the diagram index checker
        run: node --test scripts/diagrams/check-index.test.mjs

      # Forbidden tokens. This repository is public, and a few identifiers (a
      # private service host and its API paths) must never appear in it. The
      # gate stores SHA-256 digests of the normalized forms, never the strings,
      # so it cannot publish what it forbids — the cost of that choice is that a
      # failure gives you file:line and not the token. Offline, ~2 s on this tree.
      #
      # SCOPE: the tracked tree. Commit messages are NOT checked (that needs
      # full history, which this checkout does not fetch). The script's header
      # lists the other blind spots. Do not cite this step as proof that a
      # branch is free of them.
      - name: Check forbidden tokens (tree only — see the script header)
        run: node scripts/forbidden/check-forbidden-tokens.mjs

      - name: Test the forbidden-token checker
        run: node --test scripts/forbidden/check-forbidden-tokens.test.mjs

  # ==========================================================================
  # Unit Tests - Library and parser tests without external services
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: ./.github/actions/test-profile

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: ${{ env.CACHE_SAVE == 'true' && env.CACHE_FRESH == '' }}
          cache-workspace-crates: true

      # src/chat/agent_e2e_tests.rs needs the nexus fake servers (see the action).
      - name: Build the nexus fake servers used by the agent e2e tests
        uses: ./.github/actions/nexus-fakes

      - name: Run unit tests (lib)
        # --workspace so member crates' unit tests actually run in CI (the
        # neural-routing-* crates carry their own #[cfg(test)] suites that the
        # root-only `cargo test --lib` never executed). Desktop excluded — see
        # the clippy step.
        run: cargo test --workspace --exclude project-orchestrator-desktop --lib

      - name: Run parser tests
        run: cargo test --test parser_tests

      # Integration targets that need no external service (in-process axum on
      # random ports, pure logic). They were never run in CI before.
      #   p2p_integration, p2p_http_exchange: P2P pipeline + two local axum servers
      #   prompt_completeness: tool-reference/group coverage guard
      #   routing_metamorphic: RoutingProvider invariance harness
      # Deliberately NOT run here (all #[ignore]d, need live resources):
      #   mcp_federation_integration: real remote MCP servers over the network
      #   cancel_task_e2e, cancel_tools_e2e: Anthropic API key + Claude Code CLI
      - name: Run service-free integration tests
        run: cargo test --test p2p_integration --test p2p_http_exchange --test prompt_completeness --test routing_metamorphic

  # ==========================================================================
  # Integration Tests - Requires Neo4j and Meilisearch
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      neo4j:
        image: ghcr.io/this-rs/ci-mirror/neo4j:5.26.31@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      meilisearch:
        image: ghcr.io/this-rs/ci-mirror/meilisearch:v1.34.3@sha256:82767d2afc4fb6c3e4ebadb134ca6ef5687c894ae9e152928619393b1f331681
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: ./.github/actions/test-profile

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: false
          cache-workspace-crates: true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Neo4j..."
          timeout 60 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          echo "Waiting for Meilisearch..."
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "All services are ready!"

      - name: Run integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_KEY: test-master-key
        run: |
          # harness_neo4j: the Cypher of the provider settings; REQUIRED here, so a
          # missing Neo4j fails instead of passing silently.
          HARNESS_NEO4J_REQUIRED=1 cargo test --test integration_tests --test data_migrations \
            --test workspace_tests --test neo4j_store_tests --test harness_neo4j \
            --test neo4j_note_consent

  # ==========================================================================
  # API Tests - Downloads pre-built binary, requires Neo4j and Meilisearch
  # ==========================================================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [build, lint]
    permissions:
      contents: read
      packages: read
    services:
      neo4j:
        image: ghcr.io/this-rs/ci-mirror/neo4j:5.26.31@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

      meilisearch:
        image: ghcr.io/this-rs/ci-mirror/meilisearch:v1.34.3@sha256:82767d2afc4fb6c3e4ebadb134ca6ef5687c894ae9e152928619393b1f331681
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: ./.github/actions/test-profile

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: false
          cache-workspace-crates: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: target/release/

      - name: Make binaries executable
        run: chmod +x target/release/orchestrator target/release/orch target/release/mcp_server

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Neo4j..."
          timeout 60 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          echo "Waiting for Meilisearch..."
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "All services are ready!"

      - name: Write CI config.yaml
        run: |
          printf '%s\n' \
            'setup_completed: true' \
            'server:' \
            '  port: 8080' \
            '  serve_frontend: false' \
            'neo4j:' \
            '  uri: "bolt://localhost:7687"' \
            '  user: "neo4j"' \
            '  password: "testpassword"' \
            'meilisearch:' \
            '  url: "http://localhost:7700"' \
            '  key: "test-master-key"' \
            > config.yaml

      - name: Start server in background
        env:
          RUST_LOG: info
        run: |
          ./target/release/orchestrator serve --port 8080 &
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health > /dev/null 2>&1; do sleep 1; done'
          echo "Server is ready!"

      - name: Run API tests
        run: cargo test --test api_tests

  # ==========================================================================
  # Code Coverage - Generate and upload coverage report
  # ==========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      neo4j:
        image: ghcr.io/this-rs/ci-mirror/neo4j:5.26.31@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      meilisearch:
        image: ghcr.io/this-rs/ci-mirror/meilisearch:v1.34.3@sha256:82767d2afc4fb6c3e4ebadb134ca6ef5687c894ae9e152928619393b1f331681
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - uses: ./.github/actions/test-profile

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-cov-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: ${{ env.CACHE_SAVE == 'true' && env.CACHE_FRESH == '' }}
          cache-workspace-crates: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Wait for services to be ready
        run: |
          timeout 90 bash -c 'until curl -sf http://localhost:7474 > /dev/null 2>&1; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:7700/health > /dev/null 2>&1; do sleep 2; done'
          echo "Neo4j + Meilisearch ready"

      # Coverage is collected in SEVERAL runs whose profraw data is then MERGED
      # into a single lcov (`--no-report` accumulates, `llvm-cov report` merges).
      # One run cannot do it: the unit tests span the whole workspace while the
      # Neo4j/Meilisearch suites are per-test-target, and a single invocation
      # would hide one behind the other.
      #
      # `clean --workspace` first, so stale profraw from the cargo cache cannot
      # inflate the numbers.
      - name: Reset coverage profile data
        run: cargo llvm-cov clean --workspace

      # (1) Unit tests, whole workspace (member crates carry their own suites).
      # `test_large_index_performance` is a wall-clock assertion that does not
      # hold under llvm-cov instrumentation — skipped here, still run by the
      # Unit Tests job. See docs/COVERAGE.md.
      - name: Build the nexus fake servers used by the agent e2e tests
        uses: ./.github/actions/nexus-fakes

      - name: Collect coverage — unit tests (workspace)
        run: |
          cargo llvm-cov --no-report --no-fail-fast \
            --workspace --exclude project-orchestrator-desktop --lib \
            -- --skip test_large_index_performance

      # (2) Parser tests — no service needed.
      - name: Collect coverage — parser tests
        run: cargo llvm-cov --no-report --no-fail-fast --test parser_tests

      # (3) The suites that talk to the REAL Neo4j provisioned above. This is
      # what makes src/neo4j/* measurable instead of excluded: every GraphStore
      # method here runs against Neo4j, so its lines count.
      - name: Collect coverage — Neo4j integration suites
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_KEY: test-master-key
        run: |
          cargo llvm-cov --no-report --no-fail-fast \
            --test integration_tests \
            --test data_migrations \
            --test workspace_tests \
            --test neo4j_store_tests

      # (4) Merge every run above into one lcov.
      - name: Merge coverage runs into a single lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info

      # Blocking gate for src/refs (see scripts/lcov_gate.rs): Codecov is advisory
      # here, and a file no test binary compiles never shows up in the report, so
      # this reads the directory from disk. Fails the job - and the PR - when a
      # file is absent from the report or under its threshold. No `ignore` entry.
      - name: Blocking coverage gate - src/refs
        run: |
          rustc --test scripts/lcov_gate.rs -o "$RUNNER_TEMP/lcov_gate_test"
          "$RUNNER_TEMP/lcov_gate_test"
          rustc -O scripts/lcov_gate.rs -o "$RUNNER_TEMP/lcov_gate"
          "$RUNNER_TEMP/lcov_gate" lcov.info --dir src/refs --min 90 \
            --exact src/refs/access.rs \
            --exact src/refs/validate.rs \
            --exact src/refs/registry.rs

      # Guard: the merged report must actually contain the Neo4j lines. Without
      # it, a silently skipped integration suite (backends_available() returning
      # false) would upload a report that looks fine while covering nothing.
      - name: Assert the merged lcov covers src/neo4j
        run: |
          python3 scripts/assert_lcov_covers.py lcov.info \
            src/neo4j/workspace.rs \
            src/neo4j/milestone.rs \
            src/neo4j/constraint.rs \
            src/neo4j/release.rs \
            src/neo4j/commit.rs \
            src/neo4j/decision.rs \
            src/neo4j/user.rs \
            src/neo4j/traits.rs \
            src/neo4j/client.rs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  # ==========================================================================
  # Test timing - which tests make the suite slow (nightly / on demand only)
  # ==========================================================================
  # The lib suite is ~6,600 tests and ~16 minutes of EXECUTION (compilation is
  # the smaller part), and `cargo test` prints no per-test time on stable. This
  # runs it once with the timing report (RUSTC_BOOTSTRAP enables the libtest flag
  # on the pinned stable toolchain) and writes the slowest tests to the job
  # summary, so the next speed-up is chosen from a measure, not from a guess.
  test-timing:
    name: Test timing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - uses: ./.github/actions/test-profile

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test-${{ env.CACHE_VERSION }}${{ env.CACHE_FRESH }}"
          save-if: false
          cache-workspace-crates: true

      - name: Build the nexus fake servers used by the agent e2e tests
        uses: ./.github/actions/nexus-fakes

      - name: Run the lib suite with per-test times
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo test --workspace --exclude project-orchestrator-desktop --lib -- \
            -Z unstable-options --report-time 2>&1 | tee timing.log

      - name: Slowest tests
        if: always()
        run: |
          {
            echo "### Slowest 40 tests"
            echo '```'
            grep -aE '^test .* <[0-9.]+s>' timing.log \
              | sed -E 's/^test (.*) \.\.\. [a-z]+ <([0-9.]+)s>$/\2 \1/' \
              | sort -rn | head -40
            echo '```'
            echo "### Total time by module (top 15)"
            echo '```'
            grep -aE '^test .* <[0-9.]+s>' timing.log \
              | sed -E 's/^test ([^ ]+) \.\.\. [a-z]+ <([0-9.]+)s>$/\2 \1/' \
              | awk '{ n=split($2,p,"::"); m=p[1]"::"p[2]; t[m]+=$1 } END { for (k in t) printf "%.1f %s\n", t[k], k }' \
              | sort -rn | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
