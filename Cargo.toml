[workspace]
members = [".", "crates/*", "desktop/src-tauri"]
resolver = "2"

# =============================================================================
# Shared dependencies — use `dep = { workspace = true }` in member crates
# =============================================================================
[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# YAML: pure safe Rust (`#![forbid(unsafe_code)]`, parser granit-parser), with
# alias/depth/size budgets. Replaces serde_yaml (deprecated, pulled unsafe-libyaml:
# RUSTSEC-2024-0449). Use it through `project_orchestrator::yaml`, which applies
# our limits.
serde-saphyr = "1.3"
# Manifest parsing for architecture derivation (src/architecture).
# Pinned to 0.8 because that version is already resolved transitively — a wider
# range would pull a second copy for no benefit.
toml = "0.8"

# Neo4j
neo4rs = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA time-zone names for the calendar windows of a rate limit (RL1). Pinned to
# 0.8 because that version is already resolved transitively (neo4rs).
chrono-tz = "0.8"
async-trait = "0.1"
futures = "0.3"

# ML — candle (always compiled, runtime-controlled)
candle-core = "0.8"
candle-nn = "0.8"
safetensors = "0.8"

# Cache
moka = { version = "0.12", features = ["future"] }

# CPU monitoring
sysinfo = "0.39"

# =============================================================================
# Main crate
# =============================================================================
[package]
name = "project-orchestrator"
version = "0.1.0"
edition = "2021"
description = "AI agent orchestrator with Neo4j knowledge graph, Meilisearch, and Tree-sitter parsing"
authors = ["Elun <contact@ffs.holdings>"]
license = "MIT AND BUSL-1.1"
# First-party: not published, and skipped by the third-party notices (about.toml, private.ignore).
publish = false

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Web framework for webhook listener
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header", "timeout"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
indexmap = "2"
toml = { workspace = true }

# Neo4j
neo4rs = { workspace = true }

# Meilisearch
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls", "jwt_rust_crypto"] }

# Tree-sitter
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-zig = "1.1"
tree-sitter-hcl = { path = "crates/tree-sitter-hcl" }
tree-sitter-dart = { path = "crates/tree-sitter-dart" }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Graph analytics
petgraph = "0.8"
rustworkx-core = "0.18"

# LRU cache (for resolver)
lru = "0.18"

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
walkdir = "2.5"
glob = "0.3"
sha2 = "0.11"
base64 = "0.22"
hmac = "0.13"
hex = "0.4"
# Lasting permission rules (chat::lasting_rules): a fresh O_EXCL temporary file renamed over
# the rule file. Already a dev-dependency, same version.
tempfile = "3.14"
# Vault (src/vault): Argon2id derives a key from the user's passphrase,
# XChaCha20-Poly1305 seals each secret, zeroize wipes keys from memory.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive", "serde"] }
# Release version comparison (self-update checker)
semver = "1"
rayon = "1.10"
futures = { workspace = true }
async-trait = { workspace = true }

# HTTP client (for CLI) — rustls-only for cross-compilation (no OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Chat / Claude Code SDK
nexus-claude = { git = "https://github.com/this-rs/nexus.git", rev = "13f498add4a7dc1f42d506c87bbfbacccc422814", features = ["memory", "auto-download", "provider-native", "provider-codex", "provider-acp"] }
# The path resolver of nexus-tools (`files::Scope`), so that the backend confines a session that
# left trust exactly as the server would (decision fce98b8a; the same resolver, not a second one
# that could drift: P11b point 8). Same pin as nexus-claude.
nexus-tools = { git = "https://github.com/this-rs/nexus.git", rev = "13f498add4a7dc1f42d506c87bbfbacccc422814" }
tokio-stream = { workspace = true }

# Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
bcrypt = "0.19"

# P2P Identity (M4)
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
pasetors = "0.7"
multibase = "0.9"

# Self-update (archive extraction)
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

# DOCX text extraction (feature `docx`). A .docx is a ZIP of XML parts, so the
# container is handled by `zip` above and the parsing by quick-xml. 0.39 is
# already in Cargo.lock as a transitive dependency — pinning the same minor
# reuses that resolution instead of vendoring a second copy of the crate.
quick-xml = { version = "0.39", optional = true }

# XLSX text extraction (feature `xlsx`). Spreadsheets are cell grids with shared
# strings, typed values and several storage formats, so unlike DOCX/PPTX this is
# not worth hand-rolling on top of `zip`. Default features are off: `dates` and
# `picture` are not needed to read cell text.
calamine = { version = "0.36", default-features = false, optional = true }

# Home directory detection
dirs = "6"
regex = "1.12.3"

# NATS message broker (inter-process event sync)
async-nats = "0.49"

# Config
dotenvy = "0.15"
urlencoding = "2.1.3"
url = "2.5"
unicode-normalization = "0.1"
notify = { version = "8.2.0", features = ["macos_fsevent"] }

# Embedded frontend (optional — compile dist/ into the binary)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
rand = "0.10.0"
dashmap = "6"

# Neural routing — always compiled (build full), runtime-controlled via settings
neural-routing-runtime = { path = "crates/neural-routing-runtime" }
# Shared metrics (F1, AUC, ...) for the classifier evaluation bench (src/evaluation).
neural-routing-gnn = { path = "crates/neural-routing-gnn" }

# Local embeddings via ONNX Runtime (default provider — zero external dependency)
fastembed = { version = "5.17", optional = true }

# Dimensionality reduction (UMAP projection for embedding visualization)
rag-umap = "0.0"

# Statistical primitives (distribution CDFs, MLE helpers) — MIT.
# Used by `src/analytics/stats/` (first-party fitter + hypothesis tests).
# Replaced rs-stats v2.0.3 (GPL-3.0) — see `docs/migration/rs-stats/` and
# plan 00f0ca9a for the full migration audit.
# default-features disabled: we only use univariate distributions
# (StudentsT, FisherSnedecor, Normal, Gamma, …); nalgebra/rand are not needed.
statrs = { version = "0.19", default-features = false }

# openssl-sys is a transitive dep (via ort-sys build script → ureq → native-tls,
# and neo4rs → native-tls). The "vendored" feature builds OpenSSL from source,
# avoiding cross-compilation conflicts between host and target libssl-dev packages.
# Only activated for cross-compiled builds (e.g. aarch64-unknown-linux-gnu).
openssl-sys = { version = "0.9", optional = true, features = ["vendored"] }

# PDF text extraction (optional — feature `pdf`).
# MIT OR Apache-2.0. default-features = false drops `icc` (colour profiles) and
# `legacy-crypto` (RC4/MD5 for pre-AES encrypted PDFs); we only read text.
pdf_oxide = { version = "0.3.78", default-features = false, optional = true }

# Not used directly — an upper bound on a transitive dependency of pdf_oxide.
# pdf_oxide 0.3.78 requires office_oxide "0.1.9", but office_oxide 0.1.12
# (released after it) added a field to `DocumentIR`, so pdf_oxide no longer
# compiles against it: `missing field `defined_names` in initializer`. A
# semver-compatible break, which means cargo picks the broken version by
# default and `cargo update` would re-break a lockfile pin. Stating the bound
# here makes it a constraint rather than an accident. Remove once pdf_oxide
# ships a release that builds against office_oxide 0.1.12.
#
# Separately, the whole zip 8.x line was yanked on crates.io; office_oxide
# 0.1.9-0.1.12 need zip ^8.6 (unresolvable), and only 0.1.15 uses zip ^9, which
# pdf_oxide 0.3.78 does not compile against. So a fresh `cargo generate-lockfile`
# cannot resolve; ci.yml audits the committed Cargo.lock as-is. Lift both once
# pdf_oxide builds against office_oxide 0.1.15.
office_oxide = { version = ">=0.1.9, <0.1.12", default-features = false, optional = true }

# Unix process signaling (SIGINT to process group for interrupt)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["local-embeddings"]
# Local embeddings via ONNX Runtime (fastembed). Disable (--no-default-features) for the macOS legacy
# build: libonnxruntime is built for macOS 13.4+, so it cannot load on Catalina..Ventura-.
local-embeddings = ["dep:fastembed"]
docx = ["dep:quick-xml"]
pptx = ["dep:quick-xml"]
xlsx = ["dep:calamine"]
embedded-frontend = ["dep:rust-embed", "dep:mime_guess"]
vendored-openssl = ["dep:openssl-sys"]
pdf = ["dep:pdf_oxide", "dep:office_oxide"]

[dev-dependencies]
tokio-test = "0.4"
# Paused clock for the periodic update-check test
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.14"
wiremock = "0.6.5"
# Property tests of src/refs (parsing and block coding must never panic).
proptest = "1"
# The scripted provider of nexus (a harness that calls the session hooks), for the tests of
# per-turn model routing. Same pin as the dependency above.
nexus-claude = { git = "https://github.com/this-rs/nexus.git", rev = "13f498add4a7dc1f42d506c87bbfbacccc422814", features = ["testkit"] }
# The REAL verifier of the signed profile token of nexus-tools (B40): the tests check that the
# token the backend signs is the one the server accepts, and that a tool outside it never runs.
# Same pin as above (which contains nexus-tools, #68); adds the test tools.
nexus-tools = { git = "https://github.com/this-rs/nexus.git", rev = "13f498add4a7dc1f42d506c87bbfbacccc422814", features = ["test-tools"] }
# A real WebSocket client, to test the chat handler end to end (already in the lock
# tree through axum).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[[bin]]
name = "orch"
path = "src/cli.rs"

[[bin]]
name = "mcp_server"
path = "src/bin/mcp_server.rs"

# =============================================================================
# Debian packaging (cargo-deb)
# =============================================================================
[package.metadata.deb]
maintainer = "FFS SASU <contact@ffs.holdings>"
copyright = "2026, FFS SASU"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """AI agent orchestrator with Neo4j knowledge graph, \
Meilisearch semantic search, and Tree-sitter code parsing. \
Provides a REST API, WebSocket events, and an optional embedded React frontend."""
depends = "$auto"
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/orchestrator", "/usr/bin/orchestrator", "755"],
    ["target/release/orch", "/usr/bin/orch", "755"],
    ["target/release/mcp_server", "/usr/bin/orchestrator-mcp", "755"],
    # The files, shell and web tools of a native session, next to the server (P6).
    ["target/release/nexus-tools", "/usr/bin/nexus-tools", "755"],
    ["config.yaml.example", "/etc/project-orchestrator/config.yaml.example", "644"],
    ["packaging/debian/project-orchestrator.service", "/lib/systemd/system/project-orchestrator.service", "644"],
    ["packaging/debian/docker-compose.services.yml", "/etc/project-orchestrator/docker-compose.services.yml", "644"],
    # Our license (LICENSE is also the Debian `copyright` file, above) and the third-party notices
    # (scripts/third-party-licenses.sh; the release puts THIRD-PARTY-LICENSES.txt next to the binaries).
    ["LICENSE", "/usr/share/doc/project-orchestrator/LICENSE", "644"],
    ["LICENSE-MIT", "/usr/share/doc/project-orchestrator/LICENSE-MIT", "644"],
    ["LICENSE-EE", "/usr/share/doc/project-orchestrator/LICENSE-EE", "644"],
    ["target/release/THIRD-PARTY-LICENSES.txt", "/usr/share/doc/project-orchestrator/THIRD-PARTY-LICENSES.txt", "644"],
]
conf-files = ["/etc/project-orchestrator/config.yaml"]

# NOTE: No [package.metadata.deb.systemd-units] section — we handle systemd
# entirely via the assets entry + custom maintainer-scripts (postinst/prerm/postrm).
# Having both systemd-units AND an assets entry for the .service file causes
# a dpkg conflict: systemd-units installs to /usr/lib/systemd/system/ while
# assets installs to /lib/systemd/system/ (same physical path on merged-/usr).

# The variant the release builds, for both Linux arches (package-deb job).
# Linux links ONNX Runtime dynamically (ORT_PREFER_DYNAMIC_LINK=1, Microsoft's official
# build: the pyke.io one, linked statically, needs glibc 2.38 and does not link on the
# 22.04 runners). The binary's rpath is $ORIGIN (/usr/bin/) and it loads the providers
# next to itself, so the runtime is packaged there too; the release copies these next
# to the binaries before `cargo deb`.
# Depends are explicit, not `$auto`: dpkg-shlibdeps fails on a library shipped inside
# the package itself, and cannot read ARM64 libraries on the x86_64 packaging runner.
# The release checks every NEEDED library of the binaries is covered by this list
# (step "Check the declared Depends cover every needed library"): keep the two in step.
# libssl3t64 is the Ubuntu 24.04 / Debian 13 name of libssl3.
# `name`: without it cargo-deb names the package `project-orchestrator-bundled-ort` and apt
# no longer upgrades `project-orchestrator`. Up to 0.0.17 the ARM64 package was named
# `project-orchestrator-arm64-cross` (the old variant): conflicts/replaces let it be replaced.
[package.metadata.deb.variants.bundled-ort]
name = "project-orchestrator"
depends = "libc6 (>= 2.35), libgcc-s1, libstdc++6, libssl3 | libssl3t64"
conflicts = "project-orchestrator-arm64-cross"
replaces = "project-orchestrator-arm64-cross"
merge-assets.append = [
    ["target/release/libonnxruntime.so.1", "/usr/bin/libonnxruntime.so.1", "644"],
    ["target/release/libonnxruntime_providers_shared.so", "/usr/bin/libonnxruntime_providers_shared.so", "644"],
]

# =============================================================================
# RPM packaging (cargo-generate-rpm)
# =============================================================================
[package.metadata.generate-rpm]
vendor = "FFS SASU"
assets = [
    { source = "target/release/orchestrator", dest = "/usr/bin/orchestrator", mode = "755" },
    { source = "target/release/orch", dest = "/usr/bin/orch", mode = "755" },
    { source = "target/release/mcp_server", dest = "/usr/bin/orchestrator-mcp", mode = "755" },
    { source = "target/release/nexus-tools", dest = "/usr/bin/nexus-tools", mode = "755" },
    # Linux links ONNX Runtime dynamically (ORT_PREFER_DYNAMIC_LINK=1, both arches): the
    # runtime ships next to the binary ($ORIGIN rpath). The release copies these before
    # `cargo generate-rpm` (package-rpm job). See also `provides` below.
    { source = "target/release/libonnxruntime.so.1", dest = "/usr/bin/libonnxruntime.so.1", mode = "644" },
    { source = "target/release/libonnxruntime_providers_shared.so", dest = "/usr/bin/libonnxruntime_providers_shared.so", mode = "644" },
    { source = "config.yaml.example", dest = "/etc/project-orchestrator/config.yaml.example", mode = "644", config = "noreplace" },
    { source = "packaging/debian/project-orchestrator.service", dest = "/lib/systemd/system/project-orchestrator.service", mode = "644" },
    { source = "packaging/debian/docker-compose.services.yml", dest = "/etc/project-orchestrator/docker-compose.services.yml", mode = "644" },
    # Our license and the third-party notices (see the .deb assets above).
    { source = "LICENSE", dest = "/usr/share/licenses/project-orchestrator/LICENSE", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/project-orchestrator/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-EE", dest = "/usr/share/licenses/project-orchestrator/LICENSE-EE", mode = "644", doc = true },
    { source = "target/release/THIRD-PARTY-LICENSES.txt", dest = "/usr/share/licenses/project-orchestrator/THIRD-PARTY-LICENSES.txt", mode = "644", doc = true },
]
post_install_script = "packaging/rpm/postinst.sh"

[package.metadata.generate-rpm.requires]
systemd = "*"

# The automatic Requires (ldd of the binaries) name the bundled ONNX Runtime, which no
# distribution package provides: the package provides it itself, or `dnf install` refuses
# it ("nothing provides libonnxruntime.so.1()(64bit)"). VERS_1.24.2 is the symbol version
# of the Linux ORT_VERSION in release.yml: bump both together. The release checks that every
# libonnxruntime Requires is among these (step "Check the package provides its bundled
# ONNX Runtime").
[package.metadata.generate-rpm.provides]
"libonnxruntime.so.1()(64bit)" = "*"
"libonnxruntime.so.1(VERS_1.24.2)(64bit)" = "*"

