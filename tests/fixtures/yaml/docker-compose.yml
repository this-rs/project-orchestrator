# A docker-compose file in the shapes real projects use: an `x-` extension block
# with an anchor merged into services, `build` as a string and as a mapping,
# `environment` as a list and as a mapping (quoted values, an empty one),
# `depends_on` short and long, healthchecks, ports, volumes.
name: sample-app

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"

services:
  app:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: "1.95"
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MEILISEARCH_URL: http://meilisearch:7700
      NATS_URL: nats://nats:4222
      PORT: "8080"
      RUST_LOG: info
      FEATURE_FLAG: "true"
      EMPTY_VALUE:
    depends_on:
      neo4j:
        condition: service_healthy
      meilisearch:
        condition: service_started
      nats:
        condition: service_started

  frontend:
    <<: *common
    build: ./frontend
    environment:
      - API_URL=http://app:8080
      - NODE_ENV=production
    depends_on:
      - app

  neo4j:
    <<: *common
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=neo4j/PLACEHOLDER
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "RETURN 1"]
      interval: 10s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: development

  nats:
    image: nats:2.10-alpine
    command: ["-js"]

volumes:
  neo4j_data: {}
