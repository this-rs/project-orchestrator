# Index des diagrammes du depot (voir docs/DOCUMENTATION.md). Verifie hors reseau par scripts/diagrams/check-index.mjs.
# Sous-ensemble YAML strict : entrees "- name:", scalaires "cle: valeur", liste "covers:" de "- glob".
# Globs prefixes par depot : backend: frontend: nexus: website:
# status: planned = pas encore de diagramme (contenu a verifier contre le code avant export) ; verified = diagramme present et releve :
#   - EXTERNE (regle par defaut) : publie dans le service Mermaid de l'equipe (hote nomme hors depot, depot public), l'entree porte
#     mermaid_id et/ou external (<workspace>/<session>/<name>@<version>, sans hote), verified_at, verified_sha ; pas de .mmd ici ;
#   - locale (historique) : docs/diagrams/<name>.mmd present, en-tete %% verified.
# REGLE DU PROPRIETAIRE UNIQUE : deux `covers` ne doivent jamais matcher le meme fichier.
#   Un fichier couvert par deux diagrammes n'a pas de proprietaire : personne ne repond de lui.
#   Le script echoue sur tout recouvrement ; les arbitrages faits sont notes en commentaire ci-dessous.
# po-carte (role: index) est la carte d'index : c'est a elle que se rattachent les entrees, y compris
#   celles qui reprennent une carte provisoire mal nommee (champ `supersedes`).
# Les fichiers sans proprietaire sont publies dans docs/diagrams/ORPHANS.md (--write-orphans).
diagrams:
  - name: po-carte
    owner: theotime
    status: planned
    role: index
    covers:
      - "backend:docs/diagrams/INDEX.yml"
      - "backend:docs/DOCUMENTATION.md"
  - name: po-api
    owner: theotime
    status: planned
    # Arbitrage : ws_auth.rs (authentification du socket, cookie/ticket) et ws_handlers.rs
    # (multiplexage des flux CRUD et graphe) ne sont PAS du chat — ils restent ici.
    covers:
      - "backend:src/api/{mod,routes,handlers,query,ws_auth,ws_handlers,hook_handlers,auth_handlers}.rs"
      - "backend:src/auth/{mod,middleware,extractor}.rs"
  - name: po-autonomic
    owner: theotime
    status: planned
    # Arbitrage : events/reactions.rs appartient au reacteur (EventReactor), pas au cycle des plans.
    covers:
      - "backend:src/heartbeat/**"
      - "backend:src/homeostasis.rs"
      - "backend:src/reflex/**"
      - "backend:src/events/{mod,bus,hybrid,reactor,trigger,builtin_triggers,reactions}.rs"
  - name: po-ingress
    owner: theotime
    status: verified
    file: docs/diagrams/po-ingress.mmd
    # Arbitrage : le modele, le journal, les garde-fous et la route publique des evenements
    # entrants appartiennent a l'ingestion, pas a po-autonomic (cycle automatique) ni a po-api
    # (surface administrative ; po-api liste ses fichiers un par un, sans wildcard).
    covers:
      - "backend:src/api/ingress_handlers.rs"
      - "backend:src/ingress/**"
      - "backend:src/neo4j/ingress.rs"
  - name: po-chat-manager
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-manager.mmd
    covers:
      - "backend:src/chat/manager/recovery.rs"
      - "backend:src/chat/{mod,manager,cost,anchor,anchor_resolver,eval_transverse,agent_e2e_tests,tree,drain,post_stream,control_pump,oob_listener,config,types,skill_hook,post_tool_hook,hook_ledger,cli_auth,cli_version,model_catalog,compaction_context,message_attachments,pending_queue,posture,relay,refs_wiring_tests,untrusted,neutral_place,session_record,tool_clock}.rs"
      - "backend:src/notes/coactivation.rs"
  - name: po-spawn-envelope
    owner: theotime
    status: verified
    file: docs/diagrams/po-spawn-envelope.mmd
    # Arbitrage : auth/middleware.rs reste a po-api ; ici le jeton de session lie
    # (jwt.rs, jwt_crypto.rs, agent_tokens.rs) et l'enveloppe d'une session enfant (chat/envelope.rs).
    covers:
      - "backend:src/chat/{envelope,delegation_limits,subagents,mirror,session_pool,cancelled_parents}.rs"
      - "backend:src/auth/{agent_tokens,jwt,jwt_crypto,tool_profile}.rs"
  - name: po-execution-place
    owner: theotime
    status: verified
    file: docs/diagrams/po-execution-place.mmd
    # T5 : « exécute dans X ». delegate_task (api/handlers.rs) reste a po-api, l'enveloppe a po-spawn-envelope.
    covers:
      - "backend:src/api/execution_place_handlers.rs"
      - "backend:src/chat/place_confirmation.rs"
      - "backend:src/runner/ephemeral_worktree.rs"
      - "backend:src/neo4j/execution_place.rs"
  - name: po-chat-agent-runtime
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-agent-runtime.mmd
    covers:
      - "backend:src/chat/{agent_runtime,agent_hooks,cancel_relay,session_grants,lasting_rules,manual_compaction,spill,team}.rs"
      - "backend:src/chat/provider/{transcripts,hooks}.rs"
      - "backend:src/api/team_handlers.rs"
  - name: po-provider-settings
    owner: theotime
    status: verified
    file: docs/diagrams/po-provider-settings.mmd
    # Arbitrage QUOTA : les ROUTES du quota (/api/chat/providers/{id}/quota, human-only comme les
    # autres mutations de provider) vivent ici ; le REGISTRE lui-meme est dans po-chat-provider
    # (src/chat/provider/quota.rs) et sa lecture par Auto est decrite dans po-cognitive-routing.
    covers:
      - "backend:src/api/provider_handlers.rs"
      - "backend:src/api/network_tools_handlers.rs"
      - "backend:src/api/quota_handlers.rs"
  - name: po-chat-provider
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-provider.mmd
    # Resolveur backend seulement : le registre des providers et la table de prix sont dans nexus (A1).
    # Arbitrage : src/chat/provider/cognitive/** (routage cognitif, R2) appartient a po-cognitive-routing.
    covers:
      - "backend:src/chat/provider/{catalog,circuit_breaker,credentials,endpoint_guard,errors,event_map,listing,mod,native_factory,nexus_tools,oneshot,outage,policy,quota,resolver,settings,store}.rs"
      - "backend:src/chat/provider/limits/**"
      - "backend:src/chat/deferred_tools.rs"
  - name: po-cognitive-routing
    owner: theotime
    status: verified
    file: docs/diagrams/po-cognitive-routing.mmd
    # Arbitrage : src/evaluation/** appartient ici (le banc hors ligne des sept classifieurs) : ses chiffres
    # sortent par le champ additif du rapport (classifiers) et par le heartbeat classifier_bench ; les
    # cartes des domaines mesures (po-skills-reasoning, po-neurons-embeddings, po-autonomic) sont planned.
    # Routage cognitif (RFC v2, decision R2) : reglages mode/stage (B-R1), puis signature, candidats,
    # scorer, decisions, feedback, rapport (B-R2..). Les routes /api/chat/routing vivent dans routing_handlers.rs.
    covers:
      - "backend:src/chat/provider/cognitive/**"
      - "backend:src/chat/routing_modes_e2e_tests.rs"
      - "backend:src/api/routing_handlers.rs"
      - "backend:src/neo4j/routing.rs"
      - "backend:src/neo4j/segment.rs"
      - "backend:src/runner/routing.rs"
      - "backend:src/evaluation/**"
  - name: po-chat-transport
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-transport.mmd
    covers:
      - "backend:src/api/{ws_chat_handler,refs_ws_tests}.rs"
      - "backend:src/chat/wire_contract.rs"
  - name: po-p2p-transport
    owner: theotime
    status: planned
    supersedes: po-chat-transport-2
    covers:
      - "backend:src/transport/**"
      - "backend:src/reception/**"
  - name: po-code-intelligence
    owner: theotime
    status: planned
    # Arbitrage : src/graph/** (extraction depuis le code, ecriture, debounce) est ici ;
    # po-graph-store repond de la couche de persistance src/neo4j/* et des migrations.
    covers:
      - "backend:src/graph/{mod,engine,algorithms,models,process,debouncer,extraction,writer,enrichment,confidence}.rs"
      - "backend:src/analytics/{mod,hypothesis,distribution}.rs"
      - "backend:src/analytics/stats/mod.rs"
  - name: po-architecture-derive
    owner: theotime
    status: planned
    supersedes: po-code-intelligence-2
    covers:
      - "backend:src/architecture/**"
  - name: po-crates-tests
    owner: theotime
    status: planned
    # Arbitrage : xtask/ (cargo xtask in-service|pins, verifications d'apres-fusion) et son alias
    # .cargo/config.toml sont de l'outillage du depot, au meme titre que scripts/test.sh.
    covers:
      - "backend:Cargo.toml"
      - "backend:xtask/**"
      - "backend:.cargo/config.toml"
      - "backend:crates/**"
      - "backend:tests/*.rs"
      - "backend:.github/workflows/{ci,security,release}.yml"
      - "backend:.github/dependabot.yml"
      - "backend:deny.toml"
      - "backend:codecov.yml"
      - "backend:rust-toolchain.toml"
      - "backend:scripts/test.sh"
  - name: po-documents-workspace
    owner: theotime
    status: planned
    covers:
      - "backend:src/documents/**"
      - "backend:src/api/{document,workspace,project}_handlers.rs"
      - "backend:src/neo4j/{document,workspace,milestone,release,project}.rs"
  - name: po-entry-deploy
    owner: theotime
    status: planned
    # Arbitrage : src/bin/mcp_server.rs est le binaire du serveur MCP ; po-mcp en repond.
    covers:
      - "backend:src/{main,cli,setup_claude,lib}.rs"
      - "backend:src/update/**"
      - "backend:Dockerfile"
      - "backend:docker-compose*.yml"
      - "backend:config.yaml.example"
      - "backend:packaging/**"
      - "backend:desktop/src-tauri/{tauri.conf.json,src/**}"
      - "backend:scripts/build-desktop.sh"
      - "backend:scripts/third-party-licenses.sh"
      - "backend:about.toml"
      - "backend:licenses/**"
  - name: po-frontend-chat
    owner: theotime
    status: verified
    file: docs/diagrams/po-frontend-chat.mmd
    covers:
      - "frontend:src/services/{chatWebSocket,chat,wsAdapter}.ts"
      - "frontend:src/hooks/{useChat,useChatUrlSync,useSessionTree,useEffectiveCapabilities}.ts"
      - "frontend:src/hooks/runner/useConversationWs.ts"
      - "frontend:src/atoms/{chat,modelCatalog}.ts"
      - "frontend:src/utils/chatAssembly.ts"
      - "frontend:src/types/chat.ts"
      - "frontend:src/constants/models.ts"
      - "frontend:src/components/chat/{ChatPanel,ChatInput,ActivityBar,ChatMessages,ChatMessageBubble,ChatSessionContext,PermissionRequestBlock,PermissionSettingsPanel,SessionList}.tsx"
      - "frontend:src/components/chat/{messageQueue,inputAction,runningActivity,chatUrlState,sessionListUtils,sessionActivity}.ts"
      - "frontend:src/components/chat/tools/**"
      - "frontend:src/components/chat/{SecretRequestTray,ExecPlaceConfirmTray}.tsx"
      - "frontend:src/atoms/execConfirm.ts"
      - "frontend:src/services/executionPlace.ts"
      - "frontend:src/utils/executionPlace.ts"
  - name: po-frontend-shell
    owner: theotime
    status: planned
    covers:
      - "frontend:src/{App,main}.tsx"
      - "frontend:src/layouts/**"
      - "frontend:src/components/{SetupGuard,WorkspaceRouteGuard}.tsx"
      - "frontend:src/components/auth/ProtectedRoute.tsx"
