# Index des diagrammes du depot (voir docs/DOCUMENTATION.md). Verifie hors reseau par scripts/diagrams/check-index.mjs.
# Sous-ensemble YAML strict : entrees "- name:", scalaires "cle: valeur", liste "covers:" de "- glob".
# Globs prefixes par depot : backend: frontend: nexus: website:
# status: planned = pas encore de fichier .mmd (contenu a verifier contre le code avant export) ; verified = docs/diagrams/<name>.mmd present et releve.
# REGLE DU PROPRIETAIRE UNIQUE : deux `covers` ne doivent jamais matcher le meme fichier.
#   Un fichier couvert par deux diagrammes n'a pas de proprietaire : personne ne repond de lui.
#   Le script echoue sur tout recouvrement ; les arbitrages faits sont notes en commentaire ci-dessous.
# po-carte (role: index) est la carte d'index : c'est a elle que se rattachent les entrees, y compris
#   celles qui reprennent une carte provisoire mal nommee (champ `supersedes`).
# Les fichiers sans proprietaire sont publies dans docs/diagrams/ORPHANS.md (--write-orphans).
diagrams:
  - name: po-carte
    owner: theotime
    status: planned
    role: index
    covers:
      - "backend:docs/diagrams/INDEX.yml"
      - "backend:docs/DOCUMENTATION.md"
  - name: po-api
    owner: theotime
    status: planned
    # Arbitrage : ws_auth.rs (authentification du socket, cookie/ticket) et ws_handlers.rs
    # (multiplexage des flux CRUD et graphe) ne sont PAS du chat — ils restent ici.
    covers:
      - "backend:src/api/{mod,routes,handlers,query,ws_auth,ws_handlers,hook_handlers,auth_handlers}.rs"
      - "backend:src/auth/{mod,middleware,extractor}.rs"
  - name: po-autonomic
    owner: theotime
    status: planned
    # Arbitrage : events/reactions.rs appartient au reacteur (EventReactor), pas au cycle des plans.
    covers:
      - "backend:src/heartbeat/**"
      - "backend:src/homeostasis.rs"
      - "backend:src/reflex/**"
      - "backend:src/events/{mod,bus,hybrid,reactor,trigger,builtin_triggers,reactions}.rs"
  - name: po-chat-manager
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-manager.mmd
    covers:
      - "backend:src/chat/{mod,manager,drain,post_stream,control_pump,oob_listener,config,types,skill_hook,post_tool_hook,hook_ledger,cli_auth,cli_version,model_catalog,compaction_context,message_attachments}.rs"
  - name: po-chat-transport
    owner: theotime
    status: verified
    file: docs/diagrams/po-chat-transport.mmd
    covers:
      - "backend:src/api/ws_chat_handler.rs"
  - name: po-p2p-transport
    owner: theotime
    status: planned
    supersedes: po-chat-transport-2
    covers:
      - "backend:src/transport/**"
      - "backend:src/reception/**"
  - name: po-code-intelligence
    owner: theotime
    status: planned
    # Arbitrage : src/graph/** (extraction depuis le code, ecriture, debounce) est ici ;
    # po-graph-store repond de la couche de persistance src/neo4j/* et des migrations.
    covers:
      - "backend:src/graph/{mod,engine,algorithms,models,process,debouncer,extraction,writer,enrichment,confidence}.rs"
      - "backend:src/analytics/{mod,hypothesis,distribution}.rs"
      - "backend:src/analytics/stats/mod.rs"
  - name: po-architecture-derive
    owner: theotime
    status: planned
    supersedes: po-code-intelligence-2
    covers:
      - "backend:src/architecture/**"
  - name: po-crates-tests
    owner: theotime
    status: planned
    covers:
      - "backend:Cargo.toml"
      - "backend:crates/**"
      - "backend:tests/*.rs"
      - "backend:.github/workflows/{ci,security,release}.yml"
      - "backend:.github/dependabot.yml"
      - "backend:deny.toml"
      - "backend:codecov.yml"
      - "backend:rust-toolchain.toml"
      - "backend:scripts/test.sh"
  - name: po-documents-workspace
    owner: theotime
    status: planned
    covers:
      - "backend:src/documents/**"
      - "backend:src/api/{document,workspace,project}_handlers.rs"
      - "backend:src/neo4j/{document,workspace,milestone,release,project}.rs"
  - name: po-entry-deploy
    owner: theotime
    status: planned
    # Arbitrage : src/bin/mcp_server.rs est le binaire du serveur MCP ; po-mcp en repond.
    covers:
      - "backend:src/{main,cli,setup_claude,lib}.rs"
      - "backend:src/update/**"
      - "backend:Dockerfile"
      - "backend:docker-compose*.yml"
      - "backend:config.yaml.example"
      - "backend:packaging/**"
      - "backend:desktop/src-tauri/{tauri.conf.json,src/**}"
      - "backend:scripts/build-desktop.sh"
  - name: po-frontend-chat
    owner: theotime
    status: verified
    file: docs/diagrams/po-frontend-chat.mmd
    covers:
      - "frontend:src/services/{chatWebSocket,chat,wsAdapter}.ts"
      - "frontend:src/hooks/{useChat,useChatUrlSync,useSessionTree}.ts"
      - "frontend:src/hooks/runner/useConversationWs.ts"
      - "frontend:src/atoms/{chat,modelCatalog}.ts"
      - "frontend:src/utils/chatAssembly.ts"
      - "frontend:src/types/chat.ts"
      - "frontend:src/constants/models.ts"
      - "frontend:src/components/chat/{ChatPanel,ChatInput,ActivityBar,ChatMessages,ChatMessageBubble,ChatSessionContext,PermissionRequestBlock,PermissionSettingsPanel,SessionList}.tsx"
      - "frontend:src/components/chat/{messageQueue,inputAction,runningActivity,chatUrlState,sessionListUtils}.ts"
      - "frontend:src/components/chat/tools/**"
  - name: po-frontend-shell
    owner: theotime
    status: planned
    covers:
      - "frontend:src/{App,main}.tsx"
      - "frontend:src/layouts/**"
      - "frontend:src/components/{SetupGuard,WorkspaceRouteGuard}.tsx"
      - "frontend:src/components/auth/ProtectedRoute.tsx"
  - name: po-frontend-views
    owner: theotime
    status: planned
    covers:
      - "frontend:src/hooks/{useCrudEventRefresh,useCrudEventSync,useViewMode,useKanbanColumnData,usePlanGraphData}.ts"
      - "frontend:src/components/graph/entity/{EntityGraph.tsx,useNeighborhood.ts}"
      - "frontend:src/components/graph/UnifiedGraphSection.tsx"
      - "frontend:src/components/kanban/UniversalKanban.tsx"
      - "frontend:src/components/protocols/{FsmViewer,RunTreeView}.tsx"
      - "frontend:src/components/protocols/rfcLifecycle.ts"
      - "frontend:src/pages/{TodayPage,PlansPage,TasksPage,NotesPage,ProtocolsPage,ProtocolDetailPage}.tsx"
      - "frontend:src/constants/nomenclature.ts"
      - "frontend:src/services/eventBus.ts"
  - name: po-graph-store
    owner: theotime
    status: planned
    covers:
      - "backend:src/neo4j/{mod,client,traits,impl_graph_store,data_migrations,batch,registry,analytics}.rs"
      - "backend:migrations/**"
  - name: po-knowledge-notes
    owner: theotime
    status: planned
    covers:
      - "backend:src/notes/**"
      - "backend:src/neo4j/note.rs"
  - name: po-mcp
    owner: theotime
    status: planned
    covers:
      - "backend:src/mcp/**"
      - "backend:src/bin/mcp_server.rs"
  - name: po-mcp-federation
    owner: theotime
    status: planned
    covers:
      - "backend:src/mcp_federation/**"
      - "backend:src/api/mcp_federation_handlers.rs"
      - "backend:src/chat/stages/mcp_federation_stage.rs"
  - name: po-neurons-embeddings
    owner: theotime
    status: planned
    covers:
      - "backend:src/neurons/**"
      - "backend:src/embeddings/**"
      - "backend:src/meilisearch/**"
  # Arbitrage (2026-10-02) : po-nexus-sdk est RETIRE. Son perimetre (claude-code-sdk-rs/src/{lib,client,
  # query,interactive,internal_query,message_parser,types}.rs et transport/{mod,subprocess}.rs) est possede
  # par l'index DERIVE de nexus (nexus-sdk-client, -interactive, -types, -transport, -provider-boundary),
  # avec des .mmd verifies. La regle du proprietaire unique vaut ENTRE les index : des que le script a su
  # relire l'index de nexus, la reservation planned d'ici est devenue une collision sur 8 fichiers.
  - name: po-personas-identity
    owner: theotime
    status: planned
    covers:
      - "backend:src/identity/**"
      - "backend:src/sharing/**"
      - "backend:src/profile/**"
      - "backend:src/api/sharing_handlers.rs"
  - name: po-plan-lifecycle
    owner: theotime
    status: planned
    covers:
      - "backend:src/plan/**"
      - "backend:src/lifecycle/**"
      - "backend:src/neo4j/{lifecycle_hook,step,task,plan}.rs"
      - "backend:src/events/types.rs"
  - name: po-protocols
    owner: theotime
    status: planned
    covers:
      - "backend:src/protocol/**"
  - name: po-runner-orchestrator
    owner: theotime
    status: planned
    # Arbitrage : src/orchestrator/{mod,runner}.rs scanne et synchronise le code
    # (scan_files, init_embedding_provider, should_ignore_path) : po-sync-parser en repond.
    covers:
      - "backend:src/runner/{mod,runner,state,models,guard}.rs"
  - name: po-skills-reasoning
    owner: theotime
    status: planned
    covers:
      - "backend:src/skills/{mod,models,detection,evolution,lifecycle,maintenance,activation,feedback}.rs"
      - "backend:src/reasoning/**"
      - "backend:src/feedback/**"
      - "backend:src/episodes/{mod,models,collector,distill,anonymize}.rs"
  - name: po-sync-parser
    owner: theotime
    status: planned
    covers:
      - "backend:src/parser/{mod,ast_cache,helpers,noise_filter}.rs"
      - "backend:src/resolver/**"
      - "backend:src/orchestrator/{mod,runner,watcher}.rs"
  - name: po-website-docs
    owner: theotime
    status: planned
    covers:
      - "website:{package.json,vite.config.ts,src/**,scripts/**,public/robots.txt}"
      - "backend:{SKILL,AGENTS,CLAUDE}.md"
      - "backend:docs/api/**"
  - name: po-bugs
    owner: theotime
    status: verified
    file: docs/diagrams/po-bugs.mmd
    covers:
      - "backend:docs/BUGS.md"
