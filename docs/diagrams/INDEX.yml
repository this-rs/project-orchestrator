    external: project-orchestrator/architecture-po/po-plan-triggers@1
    verified_at: 2026-10-10
    verified_sha: 501cb0b9
    # Scinde de po-runner-orchestrator (une question par diagramme) : un declencheur qui tire
    # (schedule, event, webhook) passe par TriggerDispatcher et demarre le run via PlanRunnerFactory.
    covers:
      - "backend:src/runner/{dispatch,trigger}.rs"
      - "backend:src/runner/providers/**"
