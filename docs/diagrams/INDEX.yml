    owner: theotime
    status: verified
    mermaid_id: dc22b7048fb964b
    external: project-orchestrator/architecture-po/po-runner-orchestrator@3
    verified_at: 2026-10-10
    verified_sha: 501cb0b9
    # Arbitrage : src/orchestrator/{mod,runner}.rs scanne et synchronise le code
