[package]
name = "project-orchestrator-desktop"
version = "0.1.0"
edition = "2021"
description = "Project Orchestrator — Desktop application"
authors = ["Elun <contact@ffs.holdings>"]
license = "MIT AND BUSL-1.1"
# First-party: not published, and skipped by the third-party notices (about.toml, private.ignore).
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# Backend (as library)
project-orchestrator = { path = "../..", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (for health check — blocking needed for pre-Tauri startup)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Random secret generation
rand = "0.10"

# Platform directories (config path)
dirs = "7"

# Docker management
bollard = "0.21"
futures-util = "0.3"

# URL parsing (for test_connection)
url = "2"

# Error handling
anyhow = "1"

# Embedding model management (setup wizard)
fastembed = { version = "5.17", optional = true }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2"

# macOS native window styling (rounded corners, dark background, traffic lights).
# Same objc2 versions as Tauri/wry/tao already pull: no second copy of the bindings.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSAppearance",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[features]
default = ["custom-protocol", "local-embeddings"]
# ONNX Runtime embeddings (setup wizard model download + backend provider). The macOS legacy build
# turns this off: libonnxruntime needs macOS 13.4+.
local-embeddings = ["dep:fastembed", "project-orchestrator/local-embeddings"]
custom-protocol = ["tauri/custom-protocol"]
