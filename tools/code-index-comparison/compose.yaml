name: po-code-comparison
services:
  neo4j:
    image: neo4j:5.26.20-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run prepare.py first}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports: ["127.0.0.1:17474:7474"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  meilisearch:
    image: getmeili/meilisearch:v1.34.2
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Run prepare.py first}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MAX_INDEXING_THREADS: '2'
    volumes: ["meili-data:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 30
  po:
    image: po-code-comparison-tools:local
    build: .
    command: ["orchestrator", "--config", "/app/config.yaml", "serve", "--port", "8080", "--no-frontend"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      EMBEDDING_PROVIDER: disabled
      FEATURE_GRAPH_MODEL: ''
      WORKSPACE_PATH: /workspace
      SERVE_FRONTEND: 'false'
      RUST_LOG: info
      HTTP_REQUEST_TIMEOUT_SECS: '1800'
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ./sources/po:/workspace/po:ro
      - ./config.yaml:/app/config.yaml:ro
      - po-data:/data
    depends_on:
      neo4j: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null && curl -fsS 'http://localhost:8080/api/projects?limit=1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
  cbm:
    image: po-code-comparison-tools:local
    init: true
    working_dir: /workspace/po
    environment:
      CBM_ALLOWED_ROOT: /workspace
    volumes:
      - ./sources/po:/workspace/po:ro
      - cbm-data:/root/.cache/codebase-memory-mcp
  reader:
    image: po-code-comparison-tools:local
    init: true
    volumes:
      - ./sources/po:/workspace/po:ro
volumes:
  neo4j-data:
  meili-data:
  po-data:
  cbm-data:
